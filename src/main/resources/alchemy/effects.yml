schema-version: 1
effects:
  effect_test_speed:
    enabled: true
    display-name: "테스트 속도"
    description: "이동 속도를 증가시키는 테스트 효과입니다."
    priority: 10
    duration-ticks: 1200
    amplifier: 1
    max-stacks: 1
    target-policy: PLAYER
    handler-id: ""
    components:
      - id: attribute
        enabled: true
        priority: 10
        attribute: MOVEMENT_SPEED
        operation: MULTIPLY_SCALAR_1
        amount: 0.10
    policies:
      stack: REFRESH_DURATION
      remove-on-death: true
      persist-on-logout: false
      persist-on-world-change: false
      pvp-multiplier: 1.0
      boss-multiplier: 1.0
  effect_vampire:
    enabled: true
    display-name: "흡혈"
    description: "가한 피해의 일정 비율만큼 자신의 체력을 회복합니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: vampirism
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { heal-ratio: 0.05 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_berserk:
    enabled: true
    display-name: "광폭화"
    description: "가하는 피해가 증가하지만 받는 피해도 증가합니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: berserk
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { outgoing-multiplier: 1.10, incoming-multiplier: 1.05 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_corrosion:
    enabled: true
    display-name: "부식"
    description: "대상의 방어를 약화해 받는 피해가 증가합니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: corrosion
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { incoming-multiplier: 1.10 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_frostbite:
    enabled: true
    display-name: "동상"
    description: "대상의 이동 속도를 낮추고 몸을 얼어붙게 만듭니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: frostbite
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { movement-multiplier: -0.15, slowness-amplifier: 0 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_shock:
    enabled: true
    display-name: "감전"
    description: "주기적으로 피해를 주며 피해 직후 잠시 이동을 구속합니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: shock
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { tick-interval: 80, damage: 1.0, root-duration-ticks: 20, stun-duration-ticks: 20 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_bleed:
    enabled: true
    display-name: "출혈"
    description: "일정 간격으로 지속적인 출혈 피해를 줍니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: bleed
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { tick-interval: 20, damage: 1.0 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_vulnerability:
    enabled: true
    display-name: "취약"
    description: "대상이 받는 피해를 증가시킵니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: vulnerability
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { incoming-multiplier: 1.20 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
  effect_necrosis:
    enabled: true
    display-name: "괴사"
    description: "대상의 최대 체력을 감소시킵니다."
    duration-ticks: 1200
    amplifier: 0
    max-stacks: 1
    target-policy: LIVING_ENTITY
    handler-id: necrosis
    status: IMPLEMENTED_RUNTIME
    balance: BALANCE_PENDING
    baseline: { max-health-multiplier: -0.10 }
    policies: { stack: REFRESH_DURATION, remove-on-death: true, persist-on-logout: false, persist-on-world-change: false }
