# HyunseoRPG Exploration package
# Safety default: installed but disabled until desktop integration/live validation.
schema-version: 1
enabled: true

runtime:
  # BALANCE_PENDING
  heartbeat-ticks: 10

# selection-chance, radii, grace, rewards and exact variants remain BALANCE_PENDING.
# Existing records never reroll when these values are changed later.
structures:
  swamp_hut:
    minecraft-key: minecraft:swamp_hut
    enabled: true
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 32.0
    abandon-radius: 64.0
    abandon-grace-ticks: 100
    variants:
      elite_witch_prototype:
        enabled: true
        weight: 1.0
        prototype: true
        components:
          - type: scripted_spawn
            mob-id: custom:mire_shaman
            count: 1
            objective: true
            safe-spawn: true
            cleanup-unmanaged-type: WITCH
            dx: 0
            dy: 1
            dz: 0

  pillager_outpost:
    minecraft-key: minecraft:pillager_outpost
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 40.0
    loot-trigger-radius: 24.0
    loot-trigger-grace-ticks: 20
    combat-abandon-radius: 80.0
    combat-abandon-grace-ticks: 100
    variants:
      scout_wave_prototype:
        enabled: false
        weight: 0.0
        prototype: true
        components:
          - type: scripted_spawn
            mob-id: vanilla:pillager
            count: 2
            objective: true
            dx: 0
            dy: 1
            dz: 0
      outpost_raid_event:
        enabled: true
        weight: 1.0
        prototype: false
        components:
          - type: choice_prompt
            prompt-id: outpost_raid_difficulty
            phase: loot_exit
            choices: [tier1, tier2, tier3, flee]
            timeout-ticks: 400
            default-choice: flee
          - type: raid_wave_spawn
            phase: choice_tier_1
            pool-ids: [outpost_t1_wave_1, outpost_t1_wave_2]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 30
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: raid_wave_spawn
            phase: choice_tier_2
            pool-ids: [outpost_t2_wave_1, outpost_t2_wave_2, outpost_t2_wave_3]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 30
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: raid_wave_spawn
            phase: choice_tier_3
            pool-ids: [outpost_t3_wave_1, outpost_t3_wave_2, outpost_t3_wave_3, outpost_t3_wave_4]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 40
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: reward_drop
            phase: clear
            recipient: looter
            reward-id: vanilla:TOTEM_OF_UNDYING
            amount: 1

  desert_pyramid:
    minecraft-key: minecraft:desert_pyramid
    enabled: true
    selection-chance: 1.0
    balance-pending: true
    trigger-radius: 36.0
    abandon-radius: 72.0
    abandon-grace-ticks: 100
    variants:
      guardian_trial:
        enabled: true
        weight: 1.0
        prototype: true
        components:
          - type: pyramid_guardian
            mob-id: custom:stone_armored_zombie
            count: 1
            objective: true
            glowing: true
            room-radius: 1
            room-height: 2
            reject-containers: false
          - type: reward_drop
            phase: clear
            recipient: participants
            reward-id: vanilla:GOLD_INGOT
            amount: 4

  trial_chambers:
    minecraft-key: minecraft:trial_chambers
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 48.0
    abandon-radius: 96.0
    abandon-grace-ticks: 120
    variants: {}

  ocean_monument:
    minecraft-key: minecraft:monument
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 64.0
    abandon-radius: 128.0
    abandon-grace-ticks: 140
    variants: {}

  shipwreck:
    minecraft-key: minecraft:shipwreck
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 36.0
    abandon-radius: 72.0
    abandon-grace-ticks: 100
    variants: {}

  nether_fortress:
    minecraft-key: minecraft:fortress
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

  bastion_remnant:
    minecraft-key: minecraft:bastion_remnant
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

  end_city:
    minecraft-key: minecraft:end_city
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

# Raid pools are bounded per wave. Combat-time summons are intentionally not part of these totals.
