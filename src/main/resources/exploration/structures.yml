# HyunseoRPG Exploration package
# Safety default: installed but disabled until desktop integration/live validation.
schema-version: 1
enabled: true

runtime:
  # BALANCE_PENDING
  heartbeat-ticks: 10

# selection-chance, radii, grace, rewards and exact variants remain BALANCE_PENDING.
# Existing records never reroll when these values are changed later.
structures:
  swamp_hut:
    minecraft-key: minecraft:swamp_hut
    enabled: true
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 32.0
    abandon-radius: 64.0
    abandon-grace-ticks: 100
    variants:
      elite_witch_prototype:
        enabled: true
        weight: 1.0
        prototype: true
        components:
          - type: scripted_spawn
            mob-id: custom:mire_shaman
            count: 1
            objective: true
            safe-spawn: true
            cleanup-unmanaged-type: WITCH
            dx: 0
            dy: 1
            dz: 0

  pillager_outpost:
    minecraft-key: minecraft:pillager_outpost
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 40.0
    loot-trigger-radius: 24.0
    loot-trigger-grace-ticks: 20
    combat-abandon-radius: 80.0
    combat-abandon-grace-ticks: 100
    variants:
      scout_wave_prototype:
        enabled: false
        weight: 0.0
        prototype: true
        components:
          - type: scripted_spawn
            mob-id: vanilla:pillager
            count: 2
            objective: true
            dx: 0
            dy: 1
            dz: 0
      outpost_raid_event:
        enabled: true
        weight: 1.0
        prototype: false
        components:
          - type: choice_prompt
            prompt-id: outpost_raid_difficulty
            phase: loot_exit
            choices: [tier1, tier2, tier3, flee]
            timeout-ticks: 400
            default-choice: flee
          - type: raid_wave_spawn
            phase: choice_tier_1
            pool-ids: [outpost_t1_wave_1, outpost_t1_wave_2]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 30
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: raid_wave_spawn
            phase: choice_tier_2
            pool-ids: [outpost_t2_wave_1, outpost_t2_wave_2, outpost_t2_wave_3]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 30
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: raid_wave_spawn
            phase: choice_tier_3
            pool-ids: [outpost_t3_wave_1, outpost_t3_wave_2, outpost_t3_wave_3, outpost_t3_wave_4]
            repeat-on-next-wave: true
            next-wave-delay-ticks: 40
            safe-spawn: true
            dx: 0
            dy: 1
            dz: 0
          - type: reward_drop
            phase: clear
            recipient: looter
            reward-id: vanilla:TOTEM_OF_UNDYING
            amount: 1

  desert_pyramid:
    minecraft-key: minecraft:desert_pyramid
    enabled: true
    selection-chance: 1.0
    balance-pending: true
    trigger-radius: 36.0
    entry-boundary-padding: 4.0
    abandon-radius: 72.0
    abandon-grace-ticks: 100
    variants:
      guardian_trial:
        enabled: true
        weight: 1.0
        prototype: true
        components:
          - type: pyramid_room
            enabled: true
            phase: pyramid_loot_trigger
            room-radius: 4
            room-height: 4
            safety-shell: 2
            reject-containers: true
            action-id: pyramid_room_reveal
            reveal-delay-ticks: 140
            reveal-phase: pyramid_room_reveal
          - type: pyramid_room_reveal
            enabled: true
            phase: pyramid_room_reveal
          - type: pyramid_repel
            enabled: true
            phase: pyramid_entry
            horizontal-strength: 0.75
            vertical-strength: 0.32
          # CONTENT_TEXT_PENDING: placeholder quiz copy is intentionally config-owned.
          - type: choice_prompt
            enabled: true
            phase: pyramid_quiz
            prompt-id: pyramid_entry_quiz
            prompt-text: "피라미드의 수수께끼가 길을 막습니다."
            choices: [answer_a, answer_b, answer_c]
            default-choice: answer_a
            timeout-ticks: 400
            choice-labels:
              answer_a: "[답 A]"
              answer_b: "[답 B]"
              answer_c: "[답 C]"
          - type: pyramid_guardian
            enabled: true
            phase: pyramid_guardian_spawn
            mob-id: custom:stone_armored_zombie
            count: 1
            objective: true
            glowing: true
          - type: pyramid_push_pillars
            enabled: true
            phase: pyramid_pillar_restore
            cooldown-ticks: 8
            contact-radius: 1.65
            grid-scale: 1.0
            display-y-offset: 0
            display-material: SANDSTONE
            pillars:
              - id: sun
                symbol-id: sun
                color: red
                initial: "-3,-3"
                target: "-1,-1"
                allowed: ["-3,-3", "-2,-3", "-2,-2", "-1,-2", "-1,-1"]
              - id: moon
                symbol-id: moon
                color: blue
                initial: "3,-3"
                target: "1,-1"
                allowed: ["3,-3", "2,-3", "2,-2", "1,-2", "1,-1"]
              - id: emerald
                symbol-id: emerald
                color: green
                initial: "-3,3"
                target: "-1,1"
                allowed: ["-3,3", "-2,3", "-2,2", "-1,2", "-1,1"]
              - id: amethyst
                symbol-id: amethyst
                color: purple
                initial: "3,3"
                target: "1,1"
                allowed: ["3,3", "2,3", "2,2", "1,2", "1,1"]
          - type: reward_drop
            enabled: true
            phase: clear
            # BALANCE_POLICY_PENDING: do not use radius-history as a recipient set.
            recipient: entry_actor
            reward-id: vanilla:GOLD_INGOT
            amount: 4

  trial_chambers:
    minecraft-key: minecraft:trial_chambers
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 48.0
    abandon-radius: 96.0
    abandon-grace-ticks: 120
    variants: {}

  ocean_monument:
    minecraft-key: minecraft:monument
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 64.0
    abandon-radius: 128.0
    abandon-grace-ticks: 140
    variants: {}

  shipwreck:
    minecraft-key: minecraft:shipwreck
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 36.0
    abandon-radius: 72.0
    abandon-grace-ticks: 100
    variants: {}

  nether_fortress:
    minecraft-key: minecraft:fortress
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

  bastion_remnant:
    minecraft-key: minecraft:bastion_remnant
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

  end_city:
    minecraft-key: minecraft:end_city
    enabled: false
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 56.0
    abandon-radius: 112.0
    abandon-grace-ticks: 120
    variants: {}

# Raid pools are bounded per wave. Combat-time summons are intentionally not part of these totals.
