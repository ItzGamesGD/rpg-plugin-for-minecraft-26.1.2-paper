# HyunseoRPG Exploration package
# Safety default: installed but disabled until desktop integration/live validation.
schema-version: 1
enabled: false

runtime:
  # BALANCE_PENDING
  heartbeat-ticks: 10

# selection-chance, radii, grace, rewards and exact variants remain BALANCE_PENDING.
# Existing records never reroll when these values are changed later.
structures:
  swamp_hut:
    minecraft-key: minecraft:swamp_hut
    enabled: true
    selection-chance: 0.0
    balance-pending: true
    trigger-radius: 32.0
    abandon-radius: 64.0
    abandon-grace-ticks: 100
    variants:
      elite_witch_prototype:
        enabled: true
        weight: 1.0
        prototype: true
        components:
          - type: scripted_spawn
            mob-id: custom:mire_shaman
            count: 1
            objective: true
            dx: 0
            dy: 1
            dz: 0

