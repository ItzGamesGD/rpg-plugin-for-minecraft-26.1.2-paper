# 모든 자연/추가 스폰은 이 파일에서 관리합니다.
# REPLACEMENT: 바닐라 자연 스폰을 취소하고 같은 위치에 RPG 몬스터를 생성합니다.
# ADDITIVE: 바닐라 스폰을 유지하고 플레이어 주변에 별도로 생성합니다.
settings:
  enabled: true
  direct-spawn-interval-ticks: 40
  direct-spawn-chance: 0.02
  direct-spawn-max-nearby: 8
  nearby-player-radius: 96
  level-calculation: AVERAGE

spawns:
  mining_giant:
    base-mob: ZOMBIE_VILLAGER
    mode: ADDITIVE
    enabled: true
    weight: 4
    chance: 0.08
    min-rpg-level: 8
    max-rpg-level: 60
    level-source: NEAREST_PLAYER
    allowed-worlds: [world]
    biomes: []
    min-light: 0
    max-light: 7
    min-y: -64
    max-y: 320
    min-distance: 12.0
    max-distance: 28.0
    max-nearby: 2
    nearby-radius: 32.0
    max-per-chunk: 1
    global-cap: 20
    require-solid-ground: true
    require-open-space: true
    despawn-with-distance: true
    # 이전 키와의 호환성을 위해 유지합니다.
    direct-spawn: true
    replace-vanilla: false
    spawn-enabled: true

  lava_cube:
