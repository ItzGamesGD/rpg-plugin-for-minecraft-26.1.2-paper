schema-version: 2
enabled: true

# Prompt 10 contract. Values remain balance-pending until the balance stage.
unlock-stage: expert
required-abundance-points: 100 # balance placeholder; final value is pending
result-item-id: abundance_essence
result-count: 1
max-stack: 64
tradable: true
sellable: false
reverse-conversion: false
# Usage tags are allowed system purposes, not ItemRegistry tags.
# Runtime item tags stay in items.yml (for example: alchemy-catalyst).
usage-tags:
  - alchemy
  - stat-token
  - elemental-equipment
  - endgame-equipment
