schema-version: 1
enabled: true

# Stage 7 correction: enhancement owns hoe farming performance. The shared
# equipment enhancement tool profile supplies farming speed, while this file
# supplies the custom-crop durability-save curve.
limits:
  maximum-durability-save-chance: 1.0
  maximum-quality-sale-bonus: 0.05

levels:
  0:
    durability-save-chance: 0.0
    quality-sale-bonus: 0.0
  10:
    durability-save-chance: 0.05
    quality-sale-bonus: 0.01
  20:
    durability-save-chance: 0.10
    quality-sale-bonus: 0.02
  30:
    durability-save-chance: 0.15
    quality-sale-bonus: 0.03
  40:
    durability-save-chance: 0.20
    quality-sale-bonus: 0.04
  50:
    durability-save-chance: 0.25
    quality-sale-bonus: 0.05
