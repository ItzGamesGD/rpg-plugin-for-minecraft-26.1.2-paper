target-paper-version: "26.1.2"

persistence:
  autosave-seconds: 15
  max-dirty-players-per-batch: 50
  retry-on-failure: true

class-weapons:
  command-enabled: true

economy:
  coin-display:
    enabled: true
    interval-ticks: 40

mana:
  regen-interval-ticks: 20
  base-regen-per-second: 1.0
  stat-max-mana-bonus: 10.0
  stat-regen-bonus-per-second: 0.5

enhancement:
  block-vanilla-enchanting: true

resource-pack:
  enabled: false
  custom-model-data-ranges:
    class-weapons: "20001-20999"
    skill-visuals: "21001-21999"
    mob-visuals: "22001-22999"
  skill-models:
    swordmaster:
      blade:
        model-id: "hyunseorpg:swordmaster/blade"
        material: IRON_SWORD
        custom-model-data: 21001
        scale: 1.0
      light-greatsword:
        model-id: "hyunseorpg:swordmaster/light_greatsword"
        material: IRON_SWORD
        custom-model-data: 21002
        scale: 5.0
      light-greatsword-ground:
        model-id: "hyunseorpg:swordmaster/light_greatsword_ground"
        material: PAPER
        custom-model-data: 21003
        scale: 8.0

swordmaster:
  basic-splash:
    enabled: true
    radius: 3.0
    damage: 4.0
    max-targets: 8
  blade-throw:
    enabled: true
    duration-ticks: 200
    max-active-throws: 3
    max-active-blades: 60
    spawn-spread-radius: 3.0
    forward-offset: 2.0
    throw-distance-min: 10.0
    throw-distance-max: 16.0
    throw-side-spread: 7.0
    throw-flight-speed: 1.25
    hitbox-radius: 0.8
    damage-min: 0.5
    damage-max: 1.0
    blade-count-level-1: 10
    blade-count-level-2: 12
    blade-count-level-3: 14
    blade-count-level-4: 16
    blade-count-level-5: 20
  blade-launch:
    enabled: true
    search-radius: 10.0
    active-radius: 60.0
    launch-speed: 1.8
    max-range: 60.0
    miss-stuck-ticks: 40
  light-greatsword:
    enabled: true
    target-range: 30.0
    pre-delay-ticks: 20
    visual-fall-ticks: 30
    sky-height: 28.0
    radius: 10.0
    damage: 20.0
    vertical-damage-range: 16.0
    ground-mark-duration-ticks: 100
    display-duration-after-impact-ticks: 100
    snap-to-nearby-mob:
      enabled: true
      max-angle-degrees: 25.0
      max-line-distance: 8.0

bowmaster:
  fire-arrow:
    enabled: true
    arrow-count: 10
    spread-degrees: 18.0
    speed: 3.2
    lifetime-ticks: 60
    damage: 3.0
    hitbox-radius: 1.4
  laser-arrow:
    enabled: true
    range: 160.0
    visual-ticks: 14
    damage: 12.0
    hitbox-radius: 2.0
    visual-width: 0.8
    visual-segment-spacing: 1.0
    pierce-blocks: true
  arrow-rain:
    enabled: true
    target-range: 40.0
    duration-ticks: 40
    input-suppress-millis: 2500
    arrow-count: 20
    diameter: 5.0
    fall-height: 10.0
    damage: 4.0
    hitbox-radius: 2.5
    minimum-open-height: 5.0
    preferred-fall-height: 10.0
    floor-search-down-blocks: 8
    ceiling-search-up-blocks: 14
    invalid-point-retries: 5

lancer:
  spear-throw:
    enabled: true
    speed: 2.5
    lifetime-ticks: 60
    damage: 12.5
    hitbox-radius: 1.0
  charge:
    enabled: true
    distance: 10.0
    duration-ticks: 8
    damage: 10.0
    hitbox-radius: 1.4
  spear-breakthrough:
    enabled: true
    pre-delay-ticks: 20
    spear-count: 10
    spear-speed: 2.0
    spear-damage: 5.0
    charge-damage: 10.0

skill-input:
  enabled: true
  legacy-class-skills: false
  debug-messages: true
  cooldown-messages: true

enchant-runtime-debug:
  enabled: false
  cancel-vanilla-action: true
  wizard-basic-fire-damage: 2.0
  cooldowns:
    swordmaster:
      offhand-quick: 1.0
      right-click: 20.0
      drop-key: 60.0
    bowmaster:
      offhand-quick: 10.0
      left-click: 20.0
      shift-left-click: 60.0
    lancer:
      offhand-quick: 3.0
      right-click: 6.0
      drop-key: 60.0
    assassin:
      offhand-quick: 10.0
      right-click: 30.0
    wizard:
      left-click: 0.5
      offhand-quick: 3.0
      right-click: 8.0
      shift-left-click: 15.0

# Drop protection is deliberately restricted to Shift+Drop. Normal Drop remains
# available for enchantment skills that use DROP_KEY. Tools can be protected later
# without changing the listener by enabling protect-tools.
item-drop-protection:
  enabled: true
  require-shift: true
  protect-tools: false

repair:
  enabled: true
  currency: COIN
  # The legacy per-durability formula remains the neutral baseline. The
  # following factors are deliberately configurable and default to neutral.
  base-cost: 0
  durability:
    weight: 0.0
    exponent: 1.0
    minimum-cost: 50
  tier-multipliers:
    tier-1: 1.0
    tier-2: 1.10
    tier-3: 1.25
    tier-4: 1.50
    tier-5: 1.80
  enhancement:
    multiplier-per-progress: 0.50
  promotion-multipliers:
    default: 1.0
    normal-1: 1.02
    normal-2: 1.04
    normal-3: 1.06
    normal-4: 1.08
    normal-5: 1.10
    advanced-1: 1.13
    advanced-2: 1.16
    advanced-3: 1.19
    advanced-4: 1.22
    advanced-5: 1.25
    rare-1: 1.29
    rare-2: 1.33
    rare-3: 1.37
    rare-4: 1.41
    rare-5: 1.45
    heroic-1: 1.50
    heroic-2: 1.55
    heroic-3: 1.60
    heroic-4: 1.65
    heroic-5: 1.70
    legendary-1: 1.76
    legendary-2: 1.82
    legendary-3: 1.88
    legendary-4: 1.94
    legendary-5: 2.00
    mythic-1: 2.08
    mythic-2: 2.16
    mythic-3: 2.24
    mythic-4: 2.32
    mythic-5: 2.40
  cost-per-durability: 3
  minimum-cost: 50
  max-repair-percent: 100
  allow-partial-repair: true
  preserve-pdc: true
  preserve-lore: true
  allowed-types: [WEAPON, SPEAR, RANGED, TOOL, ARMOR, ELYTRA]

equipment-effects:
  # Direct block-break-speed attribute bonus per stored tool efficiency point.
  tool-block-break-speed-per-point: 0.1
  damage-reduction-cap: 0.60
  damage-indicator-radius: 0.65
  damage-indicator-min-height: 1.0
  damage-indicator-max-height: 1.7

vanilla-enchants:
  enabled: false
  block-enchanting-table: true
  block-anvil-enchants: true
  strip-loot-enchants: true
  strip-mob-drop-enchants: true
  strip-fishing-enchants: true
  block-villager-enchanted-trades: true
  sanitize-custom-equipment: true

# Only simple vanilla items in the code allow-list can use this policy.
# HyunseoRPG items, PDC-tagged items, equipment, durability items, and containers
# are always excluded. Normal ItemStack similarity still decides whether stacks merge.
vanilla-stacking:
  enabled: true
  potion:
    enabled: true
    max-stack-size: 16
  vehicles:
    enabled: true
    max-stack-size: 16
  utility:
    enabled: true
    max-stack-size: 16
    materials:
      - SADDLE
  overrides: {}

natural-discovery:
  enabled: true
  # Empty means every YAML custom item can trigger a first-discovery message.
  item-ids: []
  message: "[!] {item}을(를) 처음 발견했습니다. 아이템 설명과 모루 반응을 확인해 보세요."

progression:
  ender-dragon:
    enabled: true
    flag: post_ender_dragon
    message: "엔더드래곤 처치 기록이 저장되었습니다. 이후 콘텐츠가 해금될 수 있습니다."
