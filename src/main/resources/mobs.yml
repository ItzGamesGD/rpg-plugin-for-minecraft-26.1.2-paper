loot-crafting-schema-version: 1

vanilla-fragment-drops:
  enabled: true
  chance: 1.0
  min-amount: 1
  max-amount: 1
  item-ids:
    - fire_fragment
    - water_fragment
    - wind_fragment
    - earth_fragment
    - ice_fragment
    - soul_stone

# Only explicitly registered elemental mobs may drop matching elemental fragments.
# Ordinary vanilla and ordinary RPG mobs never use the legacy random list above.
elemental-fragments:
  enabled: true
  default-min-rpg-level: 1
  mobs:
    frost_blaze: { enabled: true, item-id: ice_fragment, min-rpg-level: 12 }
    explosive_breeze: { enabled: true, item-id: wind_fragment, min-rpg-level: 16 }
    riptide_drowned: { enabled: true, item-id: water_fragment, min-rpg-level: 18 }
    mining_giant: { enabled: true, item-id: earth_fragment, min-rpg-level: 8 }
    lava_cube: { enabled: true, item-id: fire_fragment, min-rpg-level: 8 }

admin:
  max-radius: 32
  default-radius: 8

defaults:
  mob-level: 1
  mob-id: ""

reward:
  normal-base-exp: 1
  normal-coins: 0
  rpg-base-exp: 5
  rpg-class-exp: 3
  rpg-coin-base: 1
  rpg-coin-per-level: 0.5

level-scaling:
  enabled: true
  health-base: 20.0
  health-per-level: 1.0
  attack-base: 3.0
  attack-per-level: 0.12
  low-level-bias-chance: 0.35
  random-level-variation: 15
  max-level: 100

natural-rpg-spawn:
  enabled: true
  chance: 0.7
  include-spawner: false
  include-command-spawned: false
  include-plugin-spawned: false
  include-raid-mobs: false
  # Empty allowed-types means every living mob type is allowed unless excluded below.
  allowed-types: []
  excluded-types:
    - VILLAGER
    - WANDERING_TRADER
    - ENDER_DRAGON
    - WITHER
    - WARDEN

zombie-variants:
  enabled: true
  spawn-reasons:
    natural: true
    reinforcements: false
  worlds:
    whitelist: []
    blacklist:
  total-custom-chance: 15.0
  variants:
    bomb:
      enabled: true
      weight: 50.0
      helmet:
        material: TNT
        replace-existing: true
        drop-chance: 0.0
      death-explosion:
        delay-ticks: 30
        radius: 3.0
        base-damage: 4.0
        damage-per-level: 0.15
        knockback: 0.6
        damage-players: true
        damage-mobs: false
        block-damage: false
        fire: false
    leap:
      enabled: true
      weight: 50.0
      trigger:
        minimum-range: 3.5
        maximum-range: 8.0
        warning-ticks: 10
        cooldown-ticks: 120
      movement:
        horizontal-strength: 1.1
        vertical-strength: 0.65
        disable-air-steering: true
        fall-damage-immunity-ticks: 40
      landing:
        enabled: true
        radius: 1.8
        base-damage: 2.0
        damage-per-level: 0.08
        knockback: 0.4
        damage-players: true
        damage-mobs: false
        recovery-ticks: 10

forced-rpg-zones:
  example_zone:
    enabled: false
    world: world
    min:
      x: -100
      y: -64
      z: -100
    max:
      x: 100
      y: 320
      z: 100
    mob-level: 3
    mob-id-prefix: zone
    tags:
      - rpg_mob

# The same four Mythic-compatible IDs are also registered in the core RPG
# registry so they work without MythicMobs and use the normal RPG reward path.
custom-mobs:
  golden_bulwark:
    display-name: Golden Bulwark
    vanilla-type: PIGLIN
    level: 9
    hp: 58.0
    damage: 5.0
    exp: 54
    class-exp: 16
    coin: 16
    drop-table: earth_common
    region: overworld
    tags: [rpg_mob, elite, shield]
    attributes:
      movement-speed-mode: MULTIPLIER
      movement-speed-value: 0.75
      armor: 3.0
    behavior-id: golden_bulwark
    behavior:
      recognition-range: 24.0
      frontal-half-angle: 60.0
      frontal-damage-multiplier: 0.35
      bash:
        prepare-range: 3.5
        telegraph-ticks: 12
        lunge-ticks: 6
        lunge-horizontal: 0.65
        lunge-vertical: 0.35
        hit-range: 1.8
        hit-half-angle: 45.0
        knockback-horizontal: 1.05
        knockback-vertical: 0.85
        damage: 0.0
        recovery-ticks: 18
        cooldown-ticks: 70

  mire_shaman:
