    farming-type: processing
    inputs: { crop_corn_quality_supreme: 20 }
    output: { item-id: processed_corn_starch_supreme, amount: 1 }
  process_onion_normal:
    category: materials
    farming-type: processing
    inputs: { crop_onion: 20 }
    output: { item-id: processed_onion_concentrate_normal, amount: 1 }
  process_onion_basic:
    category: materials
    farming-type: processing
    inputs: { crop_onion_quality_basic: 20 }
    output: { item-id: processed_onion_concentrate_basic, amount: 1 }
  process_onion_proficient:
    category: materials
    farming-type: processing
    inputs: { crop_onion_quality_proficient: 20 }
    output: { item-id: processed_onion_concentrate_proficient, amount: 1 }
  process_onion_advanced:
    category: materials
    farming-type: processing
    inputs: { crop_onion_quality_advanced: 20 }
    output: { item-id: processed_onion_concentrate_advanced, amount: 1 }
  process_onion_supreme:
    category: materials
    farming-type: processing
    inputs: { crop_onion_quality_supreme: 20 }
    output: { item-id: processed_onion_concentrate_supreme, amount: 1 }
  process_chili_normal:
    category: materials
    farming-type: processing
    inputs: { crop_chili: 20 }
    output: { item-id: processed_chili_extract_normal, amount: 1 }
  process_chili_basic:
    category: materials
    farming-type: processing
    inputs: { crop_chili_quality_basic: 20 }
