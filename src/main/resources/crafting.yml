# Archived legacy merchant data is retained only as a migration reference.
legacy-craft2:
  enabled: false
  title: "거래 제작"
  recipes:
    - fire_core
    - water_core
    - wind_core
    - earth_core
    - ice_core
    - magic_core
    - fireball
    - flame_spirit
    - poseidon_spear
    - poseidon_breath
    - earth_blessing
    - basic_upgrade_stone
    - magic_stone_from_fragments
    - basic_promotion_stone_from_magic

# The editor writes crafting.layout and keeps these lists as a readable fallback.
crafting:
  # Main-menu category definitions are data-driven. A new category can be
  # added here together with a layout section without Java changes.
  menu-categories:
    materials: { display-name: "재료", icon: CHEST, slot: 10 }
    equipment: { display-name: "장비", icon: DIAMOND_SWORD, slot: 12 }
    special: { display-name: "특수 장비", icon: NETHER_STAR, slot: 14 }
    consumables: { display-name: "소모품", icon: BLAZE_POWDER, slot: 16 }
  categories:
    materials:
      - fire_core
      - water_core
      - wind_core
      - earth_core
      - ice_core
      - magic_core
