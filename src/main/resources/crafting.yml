schema-version: 2

# Canonical recipe source. The integrated crafting GUI and transaction
# service read this section.
crafting-recipes:
  fire_core:
    inputs: { fire_fragment: 9 }
    output: { item-id: fire_heart, amount: 1 }
  water_core:
    inputs: { water_fragment: 9 }
    output: { item-id: water_crystal, amount: 1 }
  wind_core:
    inputs: { wind_fragment: 9 }
    output: { item-id: condensed_vortex, amount: 1 }
  earth_core:
    inputs: { earth_fragment: 9 }
    output: { item-id: earth_heart, amount: 1 }
  ice_core:
    inputs: { ice_fragment: 9 }
    output: { item-id: frozen_heart, amount: 1 }
  magic_core:
    inputs: { soul_stone: 9 }
    output: { item-id: dead_soul, amount: 1 }
  fireball:
    inputs: { fire_fragment: 1, vanilla:FIRE_CHARGE: 1 }
    output: { item-id: fireball, amount: 1 }
  flame_spirit:
    inputs: { fire_heart: 1, basic_upgrade_stone: 1 }
    output: { item-id: flame_spirit, amount: 1 }
  poseidon_spear:
    inputs: { water_crystal: 64, vanilla:TRIDENT: 3 }
    output: { item-id: poseidon_spear, amount: 1 }
  poseidon_breath:
    inputs: { water_fragment: 1, basic_upgrade_stone: 1 }
    output: { item-id: poseidon_breath, amount: 1 }
  earth_blessing:
    inputs: { earth_heart: 1, earth_fragment: 1 }
    output: { item-id: earth_blessing, amount: 1 }
  basic_upgrade_stone:
    inputs: { basic_upgrade_fragment: 10 }
    output: { item-id: basic_upgrade_stone, amount: 1 }
  magic_stone_from_fragments:
    inputs: { magic_stone_fragment: 9 }
    output: { item-id: magic_stone, amount: 1 }
  basic_promotion_stone_from_magic:
    inputs: { magic_stone: 1, basic_upgrade_stone: 1 }
    output: { item-id: basic_promotion_stone, amount: 1 }
  enchant_extraction_ticket:
    inputs: { magic_stone: 4, basic_promotion_stone: 4 }
    output: { item-id: enchant_extraction_ticket, amount: 1 }
  promotion_option_reroll_ticket:
    inputs: { magic_stone: 2, basic_promotion_stone: 1 }
    output: { item-id: promotion_option_reroll_ticket, amount: 1 }
  abundance_essence:
    category: materials
    farming-type: essence
    required-farming-stage: expert
    required-abundance-points: 100
    output: { item-id: abundance_essence, amount: 1 }
  corrosion_essence:
    category: materials
    farming-type: alchemy_essence
    required-farming-stage: expert
    inputs: { abundance_essence: 1, vanilla:ROTTEN_FLESH: 1 }
    output: { item-id: corrosion_essence, amount: 1 }
  potion_vampire:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { abundance_essence: 1, vanilla:SPIDER_EYE: 1, processed_garlic_concentrate_normal: 1 }
    output: { item-id: potion_vampire, amount: 1 }
  potion_berserk:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { abundance_essence: 1, vanilla:BLAZE_POWDER: 1, processed_chili_extract_normal: 1, vanilla:SUGAR: 1 }
    output: { item-id: potion_berserk, amount: 1 }
  potion_corrosion:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:SLIME_BALL: 1, vanilla:ROTTEN_FLESH: 1 }
    output: { item-id: potion_corrosion, amount: 1 }
  potion_frostbite:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:SNOWBALL: 1, vanilla:ICE: 1 }
    output: { item-id: potion_frostbite, amount: 1 }
  potion_shock:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:COPPER_INGOT: 1, vanilla:REDSTONE: 1 }
    output: { item-id: potion_shock, amount: 1 }
  potion_bleed:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:CACTUS: 1, processed_chili_extract_normal: 1 }
    output: { item-id: potion_bleed, amount: 1 }
  potion_vulnerability:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:ROTTEN_FLESH: 1, vanilla:SPIDER_EYE: 1 }
    output: { item-id: potion_vulnerability, amount: 1 }
  potion_necrosis:
    category: materials
    farming-type: alchemy_potion
    required-farming-stage: expert
    inputs: { corrosion_essence: 1, vanilla:WITHER_ROSE: 1, vanilla:SPIDER_EYE: 1 }
    output: { item-id: potion_necrosis, amount: 1 }
  process_corn_normal:
    category: materials
    farming-type: processing
    inputs: { crop_corn: 20 }
    output: { item-id: processed_corn_starch_normal, amount: 1 }
  process_corn_basic:
    category: materials
    farming-type: processing
    inputs: { crop_corn_quality_basic: 20 }
    output: { item-id: processed_corn_starch_basic, amount: 1 }
  process_corn_proficient:
    category: materials
    farming-type: processing
    inputs: { crop_corn_quality_proficient: 20 }
    output: { item-id: processed_corn_starch_proficient, amount: 1 }
  process_corn_advanced:
