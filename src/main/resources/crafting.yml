schema-version: 2

# Canonical recipe source. The integrated crafting GUI and transaction
# service read this section.
crafting-recipes:
  fire_core:
    inputs: { fire_fragment: 9 }
    output: { item-id: fire_heart, amount: 1 }
  water_core:
    inputs: { water_fragment: 9 }
    output: { item-id: water_crystal, amount: 1 }
  wind_core:
    inputs: { wind_fragment: 9 }
    output: { item-id: condensed_vortex, amount: 1 }
  earth_core:
    inputs: { earth_fragment: 9 }
    output: { item-id: earth_heart, amount: 1 }
  ice_core:
    inputs: { ice_fragment: 9 }
    output: { item-id: frozen_heart, amount: 1 }
  magic_core:
    inputs: { soul_stone: 9 }
    output: { item-id: dead_soul, amount: 1 }
  fireball:
    inputs: { fire_fragment: 1, vanilla:FIRE_CHARGE: 1 }
    output: { item-id: fireball, amount: 1 }
  flame_spirit:
    inputs: { fire_heart: 1, basic_upgrade_stone: 1 }
    output: { item-id: flame_spirit, amount: 1 }
  poseidon_spear:
    inputs: { water_crystal: 64, vanilla:TRIDENT: 3 }
    output: { item-id: poseidon_spear, amount: 1 }
  poseidon_breath:
    inputs: { water_fragment: 1, basic_upgrade_stone: 1 }
    output: { item-id: poseidon_breath, amount: 1 }
  earth_blessing:
    inputs: { earth_heart: 1, earth_fragment: 1 }
    output: { item-id: earth_blessing, amount: 1 }
  basic_upgrade_stone:
    inputs: { vanilla:DIAMOND: 1, vanilla:REDSTONE: 4, vanilla:LAPIS_LAZULI: 4 }
    output: { item-id: basic_upgrade_stone, amount: 1 }
  abundance_essence:
    category: materials
    farming-type: essence
    required-farming-stage: expert
    required-abundance-points: 100
    output: { item-id: abundance_essence, amount: 1 }
  corrosion_essence:
    category: materials
    farming-type: alchemy_essence
    required-farming-stage: expert
