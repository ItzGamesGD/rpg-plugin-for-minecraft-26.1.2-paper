base-level:
  max-level: 100
  # RPG Level is intentionally retained in Phase 5; its curve is unchanged.
  required-exp-multiplier: 1.0

# If a level is listed here, this exact value is used.
# Otherwise ExpTable uses the existing Minecraft-like scaling formula.
base-exp-required:
  1: 9
  2: 11
  3: 13
  4: 15
  5: 17
