schema-version: 2

quests:
  zombie_first_hunt:
    display-name: 첫 좀비 사냥
    requirements:
      - type: LEVEL
        amount: 1
    objectives:
      - id: kill_zombie_basic
        type: MOB_KILL
        target: zombie_basic
        amount: 3
    rewards:
      - type: BASE_EXP
        amount: 20
      - type: COINS
        amount: 10
      - type: PROGRESSION_FLAG
        target: quest_zombie_first_hunt_done
        amount: 1

# Automatically generated quests use only the candidates approved by the content-availability services.
auto:
  max-active: 2
  time-limit-seconds: 1800
  generation:
    max-attempts: 30
  types:
    hunt:
      enabled: true
      weight: 70
      target-count:
        min: 1
        max: 2
      amount-per-target:
        min: 5
        max: 30
    item-delivery:
      enabled: true
      weight: 30
      amount:
        min: 8
        max: 64
  cooldown:
    after-accept-seconds: 300
    after-complete-seconds: 120
    after-fail-seconds: 600
    after-abandon-seconds: 600
  rewards:
    coin:
      base: 25
      per-required: 2
    rpg-exp:
      base: 20
      per-required: 1
    upgrade-shard:
      enabled: false
    magic-shard:
      enabled: false
  exclusions:
    vanilla-mobs: [MOOSHROOM, WITHER, ENDER_DRAGON, WARDEN, ELDER_GUARDIAN]
    custom-tags: [BOSS, MINI_BOSS, RARE, EVENT_ONLY, SUMMON_ONLY, ADMIN_ONLY, NPC, TAMED_ONLY, QUEST_EXCLUDED]
  eligibility:
    vanilla-mobs: [ZOMBIE, SKELETON, SPIDER, CREEPER, HUSK, DROWNED, STRAY, SLIME, MAGMA_CUBE]
    vanilla-items: [COBBLESTONE, COAL, RAW_IRON, RAW_COPPER, RAW_GOLD, WHEAT, CARROT, POTATO, BEETROOT, OAK_LOG, SPRUCE_LOG]
    custom-monsters:
      require-discovery: true
      fallback-if-discovery-data-missing: LEVEL_AND_SPAWN
    items:
      require-discovery: false
      # Custom delivery materials stay opt-in. Do not list boss, enhancement, equipment, or special items here.
      custom-item-ids: []
      overrides: {}
