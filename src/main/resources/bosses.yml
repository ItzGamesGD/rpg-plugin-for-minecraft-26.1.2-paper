schema-version: 1

# RPGTEST Gateway Boss tuning. The central gateway is the encounter owner; the dummy is only
# a target for exercising phases until this is wired into a production boss spawner.
gateway-boss:
  enabled: true
  # Keeps the encounter active across a real arena rather than a 5-10 block prototype pocket.
  attack-range: 28.0
  orbit-radius: 5.5
  orbit-speed: 0.075
  max-orbit-weapons: 6
  weapon-throw-speed: 0.48
  weapon-throw-telegraph-ticks: 16
  sword-throw-damage: 8.0
  axe-spin-damage: 7.0
  hoe-sweep-damage: 6.0
  # Counter is deliberately slower than normal throws. It must show the gateway pulse first.
  parry-telegraph-ticks: 22
  parry-return-speed: 0.42
  parry-cooldown-ticks: 100
  vex-summon-count: 2
  max-active-summons: 6
  summon-lifetime-ticks: 240
  phase-health-thresholds:
    burst-ratio: 0.45
  attack-cooldown-ticks: 80
  burst-cooldown-ticks: 48
  cleanup-timeout-ticks: 100

boss-sessions:
  enabled: true
  wither:
    enabled: true
    duration-seconds: 600
    respawn-cooldown-seconds: 900
    participation-radius: 80
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 5000
      items:
        magic_stone: 20
        basic_upgrade_stone: 32
        wither_core: 1
  ender-dragon:
    enabled: true
    duration-seconds: 1200
    respawn-cooldown-seconds: 1800
    participation-radius: 160
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 20000
      items:
        magic_stone: 80
        dragon_core: 1
    contribution:
      damage-weight: 1.0
      end-crystal:
        enabled: true
        score-percent-of-boss-max-health: 0.03
