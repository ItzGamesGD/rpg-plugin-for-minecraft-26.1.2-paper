schema-version: 1

# RPGTEST Gateway Boss tuning. The core and compact orbital weapon cloud are always present;
# Gateway visuals exist only for the temporary long-range special phase.
gateway-boss:
  enabled: true
  attack-range: 40.0
  orbit:
    radius: 3.4
    speed: 0.075
    max-weapons: 20
    ring-plane-speed: 0.011
  basic:
    actor-total-cap: 14
    actor-lifetime-ticks: 140
    detach-telegraph-ticks: 16
    weapon-throw-speed: 0.42
    mace-melee-damage: 8.0
    axe-melee-damage: 7.0
    hoe-melee-damage: 6.0
  # The hidden Vex driver is bounded internally; it is never a visible summon or combat add.
  internal-ai-driver:
    max-active: 14
    lifetime-ticks: 180
  reflection:
    interaction:
      arrow: 0.90
      small-fireball: 1.35
      default: 1.10
  payload:
    speed-multiplier: 0.90
    local-caps:
      sonic-boom: 2
      beam: 2
      dragon-breath: 2
      flame-stream: 3
      end-crystal-bomb: 3
  damage:
    reflected:
      arrow: 6.0
      trident: 10.0
      blaze-small-fireball: 7.0
      ghast-fireball: 13.0
      wither-skull: 11.0
      shulker-bullet: 8.0
      wind-charge: 8.0
      end-crystal-bomb: 22.0
    volume:
      sonic-boom: 8.0
      dragon-breath: 4.0
      flame-stream: 3.0
      beam: 7.0
  gateway:
    count: 7
    radial-min: 16.0
    radial-max: 30.0
    upper-height: 10.0
    minimum-spacing: 5.0
    phase-spacing: 24.0
    global-payload-cap: 16
    cleanup-timeout-ticks: 100
  phase-health-thresholds:
    burst-ratio: 0.45
  attack-cooldown-ticks: 80
  burst-cooldown-ticks: 48
  cleanup-timeout-ticks: 100

boss-sessions:
  enabled: true
  wither:
    enabled: true
    duration-seconds: 600
    respawn-cooldown-seconds: 900
    participation-radius: 80
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 5000
      items:
        magic_stone: 20
        basic_upgrade_stone: 32
        wither_core: 1
  ender-dragon:
    enabled: true
    duration-seconds: 1200
    respawn-cooldown-seconds: 1800
    participation-radius: 160
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 20000
      items:
        magic_stone: 80
        dragon_core: 1
    contribution:
      damage-weight: 1.0
      end-crystal:
        enabled: true
        score-percent-of-boss-max-health: 0.03
