schema-version: 1

# RPGTEST Gateway Boss tuning. The central gateway is the encounter owner; the dummy is only
# a target for exercising phases until this is wired into a production boss spawner.
gateway-boss:
  enabled: true
  attack-range: 28.0
  orbit:
    radius: 5.5
    speed: 0.075
    max-weapons: 10
    ring-plane-speed: 0.011
  basic:
    actor-total-cap: 14
    actor-lifetime-ticks: 100
    detach-telegraph-ticks: 16
    mace-melee-damage: 8.0
    axe-melee-damage: 7.0
    hoe-melee-damage: 6.0
  # The hidden Vex driver is bounded internally; it is never a visible summon or combat add.
  internal-ai-driver:
    max-active: 6
    lifetime-ticks: 240
  reflection:
    parry-telegraph-ticks: 22
    parry-return-speed: 0.42
    parry-cooldown-ticks: 100
  gateway:
    count: 7
    radial-min: 8.0
    radial-max: 14.0
    upper-height: 5.0
    minimum-spacing: 3.0
    phase-spacing: 16.0
    global-payload-cap: 16
    cleanup-timeout-ticks: 100
  phase-health-thresholds:
    burst-ratio: 0.45
  attack-cooldown-ticks: 80
  burst-cooldown-ticks: 48
  cleanup-timeout-ticks: 100

boss-sessions:
  enabled: true
  wither:
    enabled: true
    duration-seconds: 600
    respawn-cooldown-seconds: 900
    participation-radius: 80
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 5000
      items:
        magic_stone: 20
        basic_upgrade_stone: 32
        wither_core: 1
  ender-dragon:
    enabled: true
    duration-seconds: 1200
    respawn-cooldown-seconds: 1800
    participation-radius: 160
    rewards:
      progress-min-contribution-ratio: 0.05
      coins: 20000
      items:
        magic_stone: 80
        dragon_core: 1
    contribution:
      damage-weight: 1.0
      end-crystal:
        enabled: true
        score-percent-of-boss-max-health: 0.03
