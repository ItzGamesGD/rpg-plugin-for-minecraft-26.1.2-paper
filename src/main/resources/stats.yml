max-base-stat: 8

# Values here use real in-game/plugin units, not upgrade-point units.
# If a player stat is 0, these defaults are used as the effective value.
stat-defaults:
  MAX_HEALTH: 20.0
  MAX_MANA: 100.0
  MANA_REGEN: 1.0
  ATTACK: 1.0
  ATTACK_SPEED: 4.0
  MOVE_SPEED: 0.1
  DAMAGE_REDUCTION: 0.0

stat-point-bonuses:
  MAX_HEALTH: 2.0
  MAX_MANA: 10.0
  MANA_REGEN: 0.5
  ATTACK: 1.0
  ATTACK_SPEED: 0.1
  MOVE_SPEED: 0.005
  DAMAGE_REDUCTION: 0.01

max-skill-stat: 8

class-base-mana:
  swordmaster: 100.0
  bowmaster: 120.0
  lancer: 200.0
  assassin: 100.0
  wizard: 300.0

stat-units:
  MAX_HEALTH: "health points; 20 = 10 hearts"
  MAX_MANA: "final max mana"
  MANA_REGEN: "mana per second"
  ATTACK: "damage points"
  ATTACK_SPEED: "attacks per second"
  MOVE_SPEED: "Bukkit movement speed; vanilla player default is 0.1"
  DAMAGE_REDUCTION: "damage reduction ratio; 0.2 = 20%"
