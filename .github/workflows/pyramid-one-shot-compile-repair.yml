name: Pyramid one-shot compile repair

on:
  push:
    branches:
      - fix/desert-pyramid-full-flow-reconciliation

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Install one-shot Pyramid compile repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact compile-only repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/hyunseo/hyunseorpg/core/config/ConfigMigrationService.java')
          text = path.read_text(encoding='utf-8')
          old = '                value = new LinkedHashMap<>();\n                source.forEach((key, item) -> value.put(String.valueOf(key), item));'
          new = '                value = new LinkedHashMap<>();\n                for (Map.Entry<?, ?> entry : source.entrySet()) {\n                    value.put(String.valueOf(entry.getKey()), entry.getValue());\n                }'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one compile-blocker match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit source repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pyramid-one-shot-compile-repair.yml
          git add src/main/java/com/hyunseo/hyunseorpg/core/config/ConfigMigrationService.java
          git commit -m 'Fix Pyramid migration compile blocker'
          git push origin HEAD:fix/desert-pyramid-full-flow-reconciliation
