name: One-shot exploration retirement

on:
  push:
    branches:
      - codex/refactor-custom-enchant-system-integration

permissions:
  contents: write

jobs:
  retire-legacy-exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/refactor-custom-enchant-system-integration
          fetch-depth: 0

      - name: Guard one-shot execution
        id: guard
        shell: bash
        run: |
          if [[ -f .retire-exploration-done ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        if: ${{ steps.guard.outputs.done != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: ${{ steps.guard.outputs.done != 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Retire legacy exploration and preserve Ocean Monument model
        if: ${{ steps.guard.outputs.done != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ocean-monument-logic:refs/remotes/origin/feature/ocean-monument-logic

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = "") -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          plugin = "src/main/java/com/hyunseo/hyunseorpg/HyunseoRPGPlugin.java"
          for line in (
              "import com.hyunseo.hyunseorpg.exploration.ExplorationModule;\n",
              "import com.hyunseo.hyunseorpg.exploration.integration.ExistingHyunseoRpgAdapters;\n",
              "import com.hyunseo.hyunseorpg.exploration.integration.ExplorationPorts;\n",
              "import com.hyunseo.hyunseorpg.exploration.integration.BukkitExplorationPorts;\n",
              "    private ExplorationModule explorationModule;\n",
              "        reloadService.register(\"exploration\", explorationModule::reload);\n",
              "        give.setExplorationModule(explorationModule);\n",
          ):
              replace_once(plugin, line)
          replace_once(plugin, '''        this.explorationModule = new ExplorationModule(this,
                  BukkitExplorationPorts.compose(
                          this,
                          ExistingHyunseoRpgAdapters.mobPort(mobService),
                          ExistingHyunseoRpgAdapters.itemRewardPort(itemService, inventoryDeliveryService),
                          ExistingHyunseoRpgAdapters.entityCleanupPort(mobService)),
                  null);

''')
          replace_once(plugin, '''        if (!explorationModule.start()) {
              getLogger().severe("Exploration module failed to start; keeping it disabled for this boot.");
          }
''')
          replace_once(plugin, '''        if (explorationModule != null) {
              explorationModule.stop();
          }
''')

          command = "src/main/java/com/hyunseo/hyunseorpg/command/RPGGiveCommand.java"
          for line in (
              "import com.hyunseo.hyunseorpg.exploration.ExplorationModule;\n",
              "import com.hyunseo.hyunseorpg.exploration.runtime.ExplorationStatusSnapshot;\n",
              "    private ExplorationModule explorationModule;\n",
          ):
              replace_once(command, line)
          replace_once(command, '''    public void setExplorationModule(ExplorationModule explorationModule) {
          this.explorationModule = explorationModule;
      }

''')
          replace_once(command, '''        if (args.length >= 1 && args[0].equalsIgnoreCase("exploration")) {
              handleExploration(sender, args);
              return true;
          }
''')
          p = Path(command)
          text = p.read_text()
          start = text.index("    private void handleExploration(")
          end = text.index("    private void handleFarming(", start)
          p.write_text(text[:start] + text[end:])
          replace_once(command, '''        if (args.length == 2 && args[0].equalsIgnoreCase("exploration")) {
              return explorationActionCompletion(args[1]);
          }
''')
          replace_once(command,
              'return filterCompletion(List.of("give", "pending", "reload", "doctor", "migrate", "exploration", "farming", "effect", "alchemy", "debug"), prefix);',
              'return filterCompletion(List.of("give", "pending", "reload", "doctor", "migrate", "farming", "effect", "alchemy", "debug"), prefix);')
          p = Path(command)
          text = p.read_text()
          start = text.index("    static List<String> explorationActionCompletion(")
          end = text.index("    static List<String> farmingActionCompletion(", start)
          p.write_text(text[:start] + text[end:])
          replace_once(command,
              'return filterCompletion(List.of("configs", "items", "mobs", "players", "farming",\n                "alchemy", "exploration", "legacy", "cleanup", "all"), prefix);',
              'return filterCompletion(List.of("configs", "items", "mobs", "players", "farming",\n                "alchemy", "legacy", "cleanup", "all"), prefix);')

          migration = "src/main/java/com/hyunseo/hyunseorpg/core/config/ConfigMigrationService.java"
          replace_once(migration, '''            if (normalized.equals("exploration") || normalized.equals("all")) {
                  migrateExploration(lines, changedFiles);
              }
''')
          replace_once(migration,
              'List.of("configs", "items", "mobs", "players", "farming", "alchemy", "exploration", "legacy", "cleanup", "all")',
              'List.of("configs", "items", "mobs", "players", "farming", "alchemy", "legacy", "cleanup", "all")')

          architecture = "src/test/java/com/hyunseo/hyunseorpg/architecture/LegacyPlayerRpgCoreRemovalArchitectureTest.java"
          replace_once(architecture, '''    @Test
      void questRuntimeIsAbsentWhileWorldExplorationRemainsWired() throws IOException {
          String plugin = Files.readString(PRODUCTION.resolve("com/hyunseo/hyunseorpg/HyunseoRPGPlugin.java"));
          for (String removed : List.of("QuestRegistry", "QuestService", "AutoQuestService",
                  "QuestProgressListener", "reloadQuestsConfig", "questRegistry")) {
              assertFalse(plugin.contains(removed));
          }
          assertTrue(plugin.contains("new ExplorationModule("));
          assertTrue(plugin.contains("explorationModule::reload"));
          assertTrue(plugin.contains("explorationModule.start()"));
          assertTrue(plugin.contains("explorationModule.stop()"));
      }
''', '''    @Test
      void questAndLegacyExplorationRuntimeStayRetiredWhileOceanModelRemains() throws IOException {
          String plugin = Files.readString(PRODUCTION.resolve("com/hyunseo/hyunseorpg/HyunseoRPGPlugin.java"));
          String command = Files.readString(PRODUCTION.resolve("com/hyunseo/hyunseorpg/command/RPGGiveCommand.java"));
          for (String removed : List.of("QuestRegistry", "QuestService", "AutoQuestService",
                  "QuestProgressListener", "reloadQuestsConfig", "questRegistry")) {
              assertFalse(plugin.contains(removed));
          }
          assertFalse(plugin.contains("ExplorationModule"));
          assertFalse(plugin.contains("explorationModule"));
          assertFalse(command.contains("setExplorationModule"));
          assertFalse(command.contains("handleExploration"));
          Path exploration = PRODUCTION.resolve("com/hyunseo/hyunseorpg/exploration");
          assertFalse(Files.exists(exploration.resolve("ExplorationModule.java")));
          assertFalse(Files.exists(exploration.resolve("runtime")));
          assertFalse(Files.exists(exploration.resolve("pyramid")));
          assertFalse(Files.exists(exploration.resolve("raid")));
          assertTrue(Files.exists(exploration.resolve("ocean/OceanMonumentProgress.java")));
          assertTrue(Files.exists(exploration.resolve("ocean/MonumentPhase.java")));
      }
''')

          doc = "docs/gameplay-subsystem-simplification-stage-6.md"
          replace_once(doc,
              "World-native exploration encounters remain bootstrapped, reloadable, and cleanly shut down. Pyramid, Outpost, Shipwreck, and Ocean Monument behavior stays independent from the removed quest runtime; Gateway Boss remains independent and active.",
              "The legacy ExplorationModule runtime and its Pyramid, Outpost, Shipwreck, and generic structure framework are retired from production. Only the runtime-independent Ocean Monument logical state model is retained as dormant design code for a possible future vanilla/datapack-native implementation; it is not bootstrapped, reloaded, or exposed through commands. Gateway Boss remains independent and active.")

          mobs = "src/main/resources/mobs.yml"
          replace_once(mobs,
              "    drop-table: skeleton_king\n    region: boss\n",
              "    drop-table: \"\"\n    region: boss\n")
          PY

          rm -rf src/main/java/com/hyunseo/hyunseorpg/exploration
          mkdir -p src/main/java/com/hyunseo/hyunseorpg/exploration/ocean
          for file in MonumentActionResult.java MonumentPhase.java OceanMonumentProgress.java; do
            git show "origin/feature/ocean-monument-logic:src/main/java/com/hyunseo/hyunseorpg/exploration/ocean/$file" \
              > "src/main/java/com/hyunseo/hyunseorpg/exploration/ocean/$file"
          done

          rm -rf src/test/java/com/hyunseo/hyunseorpg/exploration
          mkdir -p src/test/java/com/hyunseo/hyunseorpg/exploration/ocean
          git show "origin/feature/ocean-monument-logic:src/test/java/com/hyunseo/hyunseorpg/exploration/ocean/OceanMonumentProgressTest.java" \
            > src/test/java/com/hyunseo/hyunseorpg/exploration/ocean/OceanMonumentProgressTest.java

          rm -rf src/main/resources/exploration
          printf 'applied\n' > .retire-exploration-done

          if git grep -nE 'ExplorationModule|handleExploration|setExplorationModule' -- src/main; then
            echo 'Legacy exploration runtime reference remains in production source.' >&2
            exit 1
          fi
          test -f src/main/java/com/hyunseo/hyunseorpg/exploration/ocean/OceanMonumentProgress.java
          test ! -e src/main/java/com/hyunseo/hyunseorpg/exploration/runtime
          test ! -e src/main/resources/exploration
          git diff --check

      - name: Build and test retired exploration state
        if: ${{ steps.guard.outputs.done != 'true' }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Commit retired exploration state
        if: ${{ steps.guard.outputs.done != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove legacy exploration runtime and preserve ocean model"
          git push origin HEAD:codex/refactor-custom-enchant-system-integration
