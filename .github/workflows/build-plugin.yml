name: Build HyunseoRPG Plugin

on:
  push:
    branches:
      - ci/build-plugin-artifact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and verify plugin
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: List produced JARs
        run: ls -lah build/libs

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HyunseoRPG-plugin
          path: build/libs/HyunseoRPG-*.jar
          if-no-files-found: error
          retention-days: 7
