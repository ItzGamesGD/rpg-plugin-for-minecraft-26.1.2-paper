name: Exploration build and JUnit

on:
  push:
    branches:
      - "codex/exploration-*"
      - "codex/fix-runtime-regressions-for-poseidon-s-spear-and-flame-axe"
      - "fix/desert-pyramid-full-flow-reconciliation"
  pull_request:
    branches:
      - "codex/exploration-*"
      - "main"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean build and JUnit
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --no-daemon
